<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOTUS — Connexion</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-brand">
      <h1>MOTUS</h1>
      <p>Mo mo mo MOTUS !</p>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-login">Connexion</button>
      <button class="tab" id="tab-register">Inscription</button>
    </div>

    <div id="alert-box"></div>

    <!-- Formulaire connexion -->
    <div id="form-login">
      <div class="field">
        <label for="login-username">Pseudo</label>
        <input type="text" id="login-username" placeholder="Votre pseudo" autocomplete="username" />
        <div class="field-error" id="login-username-err"></div>
      </div>
      <div class="field">
        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
        <div class="field-error" id="login-password-err"></div>
      </div>
      <button class="auth-submit" id="btn-login">Se connecter</button>
    </div>

    <!-- Formulaire inscription -->
    <div id="form-register" style="display: none">
      <div class="field">
        <label for="reg-username">Pseudo</label>
        <input type="text" id="reg-username" placeholder="Entre 3 et 20 caractères" />
        <div class="field-error" id="reg-username-err"></div>
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="votre@email.com" />
        <div class="field-error" id="reg-email-err"></div>
      </div>
      <div class="field">
        <label for="reg-password">Mot de passe</label>
        <input type="password" id="reg-password" placeholder="8 caractères minimum" />
        <div class="field-error" id="reg-password-err"></div>
      </div>
      <div class="field">
        <label for="reg-confirm">Confirmer le mot de passe</label>
        <input type="password" id="reg-confirm" placeholder="Répétez le mot de passe" />
        <div class="field-error" id="reg-confirm-err"></div>
      </div>
      <button class="auth-submit" id="btn-register">Créer mon compte</button>
    </div>

  </div>
</div>

<!-- Classes -->
<script src="js/classes/Database.js"></script>
<script src="js/classes/UserManager.js"></script>
<!-- Page -->
<script src="js/pages/auth.js"></script>

</body>
</html>
